<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo SuruhNgoding</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.loader{text-align:center;opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#06b6d4;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:rgba(255,255,255,.5);font-size:.875rem}
.hidden{display:none}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div><p>Memuat halaman...</p></div>
<div id="content" class="hidden"></div>
<script>
(async function(){const k=await crypto.subtle.importKey('raw',new Uint8Array([25,180,215,103,61,85,30,200,122,120,66,14,243,7,198,117]),{name:'AES-CBC'},false,['decrypt']);try{var r=await fetch('promo.dat');var e=await r.text();var d=Uint8Array.from(atob(e),c=>c.charCodeAt(0));var p=await crypto.subtle.decrypt({name:'AES-CBC',iv:new Uint8Array([167,236,184,231,228,109,249,117,129,170,192,96,49,31,219,190])},k,d);var h=new TextDecoder().decode(p);document.getElementById('content').innerHTML=h;document.getElementById('loader').classList.add('hidden');document.getElementById('content').classList.remove('hidden')}catch(e){document.getElementById('loader').innerHTML='<p style=color:#ef4444>Gagal memuat halaman</p>'}})();
</script>
</body>
</html>
